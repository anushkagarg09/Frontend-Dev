<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Grid Image Gallery with Filters</title>
  <link rel="stylesheet" href="gallery.css">
</head>
<body>
  <h1 class="title">Responsive Image Gallery with Filters</h1>
  
  <div class="gallery">
    <div class="image-item">
      <img src="https://picsum.photos/id/1015/400/300" alt="Mountain View">
      <p>Blur Effect</p>
    </div>

    <div class="image-item">
      <img src="https://picsum.photos/id/1016/400/300" alt="Forest Path">
      <p>Grayscale Effect</p>
    </div>

    <div class="image-item">
      <img src="https://picsum.photos/id/1025/400/300" alt="Dog Portrait">
      <p>Sepia Effect</p>
    </div>

    <div class="image-item">
      <img src="https://picsum.photos/id/1035/400/300" alt="Bridge Sunset">
      <p>Brightness Effect</p>
    </div>

    <div class="image-item">
      <img src="https://picsum.photos/id/1045/400/300" alt="City Skyline">
      <p>Contrast Effect</p>
    </div>

    <div class="image-item">
      <img src="https://picsum.photos/id/1055/400/300" alt="Beach View">
      <p>Hue-Rotate Effect</p>
    </div>
  </div>
</body>
</html>
